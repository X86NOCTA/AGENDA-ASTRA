<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14508c">
<title>ASTRA Limpadora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#14508c;--p2:#2b7bd1;--bg:#eef3f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--ok:#16a34a;--r:18px;--sh:0 8px 24px -12px #14508c55}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e6edf7;--mut:#8b9ab3;--line:#243049;--soft:#0f1829;--sh:0 8px 24px -12px #000a}}
*{-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx);padding-bottom:96px}
header{background:linear-gradient(135deg,#0c3560,var(--p) 55%,var(--p2));color:#fff;padding:16px 18px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 28px 28px;box-shadow:0 14px 30px -14px #14508cbb}
header img{filter:drop-shadow(0 3px 6px #0005);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 20px));display:flex;overflow-x:auto;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 12px 32px -8px #0006;padding:6px;z-index:9;scrollbar-width:none}
nav button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;padding:8px 6px;border:0;background:none;color:var(--mut);font-family:inherit;font-weight:700;font-size:10.5px;border-radius:18px;transition:.3s}
nav button i{font-style:normal;font-size:21px;transition:transform .3s}
nav button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 14px -6px var(--p)}
nav button.on i{transform:translateY(-2px) scale(1.18)}
main{max-width:720px;margin:auto;padding:18px 14px}
h3{margin:0 0 6px;font-weight:800}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--sh);animation:up .55s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px)}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:4px 0;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:var(--soft);color:var(--tx);transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--p2);box-shadow:0 0 0 4px #2b7bd133}
button.b{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;border-radius:12px;padding:10px 15px;margin:6px 6px 0 0;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 16px -8px var(--p);transition:.2s;position:relative;overflow:hidden;cursor:pointer}
button.b:hover{transform:translateY(-2px)}button.b:active{transform:scale(.94)}
button.g{background:linear-gradient(135deg,#15803d,#22c55e)}button.r{background:linear-gradient(135deg,#b91c1c,#ef4444)}
#out{background:#ffffff26;box-shadow:none;margin:0}
.rp{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff7;animation:rp .6s forwards;pointer-events:none}@keyframes rp{to{transform:scale(25);opacity:0}}
small{color:var(--mut)}summary{cursor:pointer}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:#fef3c7;color:#b45309;text-transform:uppercase;letter-spacing:.4px}.pill.concluido{background:#dcfce7;color:#15803d}.pill.pg_pago{background:#dcfce7;color:#15803d}.pill.pg_cancelado{background:#fee2e2;color:#b91c1c}.pill.pg_garantia{background:#dbeafe;color:#1d4ed8}
.stat{color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--sh);animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.stat:after{content:"";position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:#ffffff24}
.stat small{color:#ffffffd9}.stat b{display:block;font-size:32px;margin:4px 0;font-weight:800}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#15803d,#22c55e);border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

    if(S.some(x=>x.id!=ES&&x.status=='agendado'&&new Date(x.data_hora).toDateString()==dx.toDateString()&&(new Date(x.data_hora).getHours()<12?'manha':'tarde')==pe)&&!confirm('Já existe serviço agendado neste período. Salvar mesmo assim?'))return}

  const tipo=A.map(i=>(i.q>1?i.q+'x ':'')+i.nome).join(' + ');
  const row={cliente_id:v('s_c'),tipo,data_hora:dx.toISOString(),valor:T,endereco:v('s_e')||null,intervalo_meses:M,comissao:pm('s_com'),funcionario:v('s_f').trim()||null,status:ex?'concluido':'agendado'};
  if(tipo!=o.tipo)row.custo=A.reduce((s,i)=>s+i.q*Number((K.find(k=>k.id==i.kid)||{}).custo||0),0);
  const fr=$('#s_fa').checked?pm('s_fv'):0;if(fr>0||'frete' in o)row.frete=fr>0?fr:0;

  const PLs=plCl('s'),hc='pagamentos' in o;

function listC(){

  const t=nz(CB).trim(),td=t.replace(/\D/g,'');
  const L=C.filter(c=>{if(!t)return true;
    const txt=nz([c.nome,c.sobrenome,full(c),c.rua,c.numero,c.bairro,c.cidade,c.endereco,ender(c),c.telefone].join(' '));
    return txt.includes(t)||(td&&String(c.telefone||'').replace(/\D/g,'').includes(td))});
  if(!L.length)return '<div class=card><small>Nenhum cliente encontrado.</small></div>';

}

  o.endereco=ender(o);

async function delC(id){if(confirm('Excluir cliente e todo o histórico?')){await sb.from('astra_clientes').delete().eq('id',id);load()}}

function pend(){const hoje=new Date();return C.map(c=>{const h=S.filter(s=>s.cliente_id==c.id);
  if(h.some(s=>s.status=='agendado'))return null;
  const u=h.filter(s=>s.status=='concluido').pop();if(!u)return null;
  const due=addM(u.data_hora,u.intervalo_meses);return due<=hoje?{c,u,due}:null}).filter(Boolean)}
function vReativar(){
  const L=pend();
  return `<div class=card><b>Clientes para lembrar</b><br><small>Aparecem quando chega o prazo escolhido em cada serviço.</small></div>`+(L.map(({c,u,due})=>`<div class=card><b>${esc(full(c))}</b><br>${esc(u.tipo)} em ${dd(u.data_hora)}<br><small>Prazo venceu em ${dd(due)}${u.lembrete_enviado?' · ✅ lembrete já enviado':''}</small><br>
  <button class="b g" onclick="remind('${c.id}','${u.id}')">${u.lembrete_enviado?'Enviar de novo':'Enviar lembrete no WhatsApp'}</button></div>`).join('')||'<div class=card><small>Nenhum cliente para lembrar agora.</small></div>');
}
async function remind(cid,sid){const c=cli(cid),s=S.find(x=>x.id==sid);
  wa(c.telefone,`Olá, ${fn(c)}! Aqui é da ASTRA Limpadora. Já faz um tempo desde o nosso último serviço (${s.tipo}, em ${dd(s.data_hora)}). Que tal agendar uma nova higienização? Posso verificar um horário para você?`);
  await sb.from('astra_servicos').update({lembrete_enviado:true}).eq('id',sid);load()}

async function upK(id){
  const nome=$('#kn_'+id).value.trim();if(!nome)return alert('O nome não pode ficar vazio');
  const o={nome,tipo:$('#kt_'+id).value,valor:parseInt($('#kv_'+id).value.replace(/\D/g,'')||'0',10)/100};
  const {error}=await sb.from('astra_catalogo').update(o).eq('id',id);
  if(error)return alert(error.message);
  Object.assign(K.find(x=>x.id==id),o);$('#sv_'+id).textContent='✓ salvo';
}
async function saveNR(){
  const rows=NR.filter(r=>r.nome.trim()).map(r=>({nome:r.nome.trim(),tipo:r.tipo,valor:r.valor,custo:r.custo||0}));
  if(!rows.length)return alert('Preencha o nome de pelo menos um item');
  const {error}=await sb.from('astra_catalogo').insert(rows);
  if(error)return alert(error.message);NR=[{nome:'',tipo:'servico',valor:0}];load();
}

const tot=a=>a.reduce((s,i)=>s+i.q*i.valor,0);

function pick(id,el){if(el.value)addI(id,el.value);el.value=''}
function selH(id){const arr=id=='o'?O:A;return arr.map((i,n)=>`<div class=card style="background:var(--soft);margin:6px 0"><b>${esc(i.nome)}</b>
  <small>Quantidade</small><input type=number min=1 value=${i.q} onchange="setI('${id}',${n},'q',this.value)">
  ${id=='o'?`<small>Valor unitário (você pode alterar)</small><input inputmode=numeric value="${money(i.valor)}" oninput=mk(this) onchange="setI('${id}',${n},'valor',this.value)">`:''}
  <small>Subtotal: ${brl(i.q*i.valor)}</small> <button class="b r" onclick="rmI('${id}',${n})">Remover</button></div>`).join('')}
function upd(id){$('#'+id+'_s').innerHTML=selH(id);if(id=='a'&&$('#pl_s'))$('#pl_s').innerHTML=plRes('s');const t=$('#'+id+'_t');if(t)t.textContent=brl(tot(id=='o'?O:A));if(id=='o'&&$('#o_txv'))txCalc()}
function addI(id,kid){const k=K.find(x=>x.id==kid);if(!k)return;const arr=id=='o'?O:A,e=arr.find(i=>i.kid==kid);e?e.q++:arr.push({kid,nome:k.nome,valor:Number(k.valor),q:1});upd(id)}
function rmI(id,n){(id=='o'?O:A).splice(n,1);upd(id)}
function setI(id,n,f,val){const i=(id=='o'?O:A)[n];i[f]=f=='q'?Math.max(1,parseInt(val)||1):parseInt(String(val).replace(/\D/g,'')||'0',10)/100;upd(id)}
const FP={pix:'PIX',dinheiro:'Dinheiro',credito:'Cartão de crédito',debito:'Cartão de débito'};
// Taxas da maquininha (%): ficam em TX e são editadas na aba Custos. PIX e dinheiro = sem taxa.
const pf=x=>String(x).replace('.',',');
const taxaDe=(f,p)=>f=='debito'?TX.deb:f=='credito'?(TX['c'+(p||1)]||0):0;
const txv=q=>Number(q.valor)*taxaDe(q.forma_pagto,q.parcelas)/100;
const txPct=()=>taxaDe(v('o_fp'),+v('o_pc')||1);
const numO=()=>{let n;do{n=String(Math.floor(100000+Math.random()*900000))}while(Q.some(q=>q.numero==n));return n};

  const q=EO?Q.find(x=>x.id==EO):null;
  return `<div class=card><h3>${q?'Editando orçamento #'+esc(q.numero||'—'):'Novo orçamento'}</h3><small>Cliente</small><select id=o_c>${copts(q&&q.cliente_id)}</select>${picker('o')}
  
  <small>Forma de pagamento aceita pelo cliente</small><select id=o_fp onchange=fpCh()><option value="">Ainda não definida</option>${Object.keys(FP).map(k=>`<option value="${k}">${FP[k]}</option>`).join('')}</select>
  <div id=o_cr style="display:none"><small>Parcelas no cartão de crédito</small><select id=o_pc onchange=txCalc()>${[1,2,3].map(n=>`<option value=${n}>${n}x (taxa ${pf(TX['c'+n])}%)</option>`).join('')}</select></div>
  <small id=o_txv></small>
  <p><b>Total: <span id=o_t>${brl(tot(O))}</span></b></p>
  <button class="b" onclick="saveO(false)">💾 Salvar</button><button class="b g" onclick="saveO(true)">Salvar e enviar no WhatsApp</button>${q?`<button class=b onclick="cancelO()">Cancelar edição</button>`:''}</div>
  <div class=card><h3>Orçamentos</h3><input id=o_b placeholder="🔍 Buscar por número (ex: 123456) ou nome do cliente" value="${esc(QB)}" oninput="QB=this.value;$('#o_list').innerHTML=listO()"></div><div id=o_list>${listO()}</div>`;
}
function listO(){
  const t=QB.trim().toLowerCase().replace(/^#/,''),L=Q.filter(q=>!t||String(q.numero||'').includes(t)||full(cli(q.cliente_id)).toLowerCase().includes(t));
  return L.map(q=>`<div class=card><b>#${esc(q.numero||'—')}</b> · ${esc(full(cli(q.cliente_id)))} <span class="pill ${q.status=='agendado'?'concluido':''}">${q.status=='agendado'?'agendado':'não agendado'}</span><br>
  <b>${brl(q.valor)}</b> · <small>${dd(q.created_at)}</small><br><small>${esc((q.itens||[]).map(i=>(i.q>1?i.q+'x ':'')+i.nome).join(' + '))}</small>
  ${q.forma_pagto?`<br><small>💳 ${FP[q.forma_pagto]||''}${q.forma_pagto=='credito'&&q.parcelas?' em '+q.parcelas+'x':''}${txv(q)>0?' · taxa '+pf(taxaDe(q.forma_pagto,q.parcelas))+'% = '+brl(txv(q)):''}</small>`:''}
  <br>
  <button class=b onclick="editO('${q.id}')">✏️ Editar</button><button class="b g" onclick="resendO('${q.id}')">WhatsApp</button>${q.status=='aberto'?`<button class="b g" onclick="agendarO('${q.id}')">Agendar</button>`:''}<button class="b r" onclick="delO('${q.id}')">Excluir</button></div>`).join('')||'<div class=card><small>Nenhum orçamento encontrado.</small></div>';
}
function fpCh(){const f=v('o_fp');$('#o_cr').style.display=f=='credito'?'':'none';txCalc()}
function txCalc(){const T=tot(O),p=txPct(),t=T*p/100;$('#o_txv').textContent=p?'Taxa da maquininha ('+String(p).replace('.',',')+'%): '+brl(t)+' · Líquido após a taxa: '+brl(T-t):''}
function resetO(){EO=null;O=[];['o_fr','o_fp','o_pc'].forEach(k=>{delete FS[k];const e=$('#'+k);if(e)e.value=k=='o_pc'?'1':''})}
function cancelO(){resetO();draw()}
function editO(id){const q=Q.find(x=>x.id==id);if(!q)return;EO=id;O=(q.itens||[]).map(i=>({...i}));tab='orc';draw();
  $('#o_c').value=q.cliente_id;$('#o_fp').value=q.forma_pagto||'';$('#o_pc').value=q.parcelas>3?1:(q.parcelas||1);fpCh();window.scrollTo(0,0)}
function msgO(c,itens,T,num){
  const sl=slots(),it=itens.map(i=>`${i.q}x ${i.nome} = ${brl(i.q*i.valor)}`).join('\n');
  const dias=sl.map(s=>`${s.x.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}: ${s.f.map(t=>t==9?'manhã (9h)':'tarde (14h)').join(' ou ')}`).join('\n');
  return `Olá, ${fn(c)}! Segue o orçamento nº ${num} da ⭐ ASTRA Limpadora:\n\n${it}\n\n*Total: ${brl(T)}*\n\nPagamento:\nCartão de crédito em até 3x sem juros\nÀ vista no Pix ou dinheiro, com 10% de desconto: *${brl(T*0.9)}*\n\nDatas disponíveis:\n${dias||'Consulte nossa disponibilidade.'}\n\nQual horário você prefere?`}
function resendO(id){const q=Q.find(x=>x.id==id),c=cli(q.cliente_id);wa(c.telefone,msgO(c,q.itens||[],Number(q.valor),q.numero||'—'))}
async function saveO(send){
  const c=cli(v('o_c'));if(!c.id)return alert('Escolha o cliente');if(!O.length)return alert('Adicione itens ao orçamento');
  const T=tot(O),fp=v('o_fp')||null,pct=txPct();
  const o={cliente_id:c.id,itens:O.map(i=>({kid:i.kid,nome:i.nome,valor:i.valor,q:i.q})),valor:T,forma_pagto:fp,parcelas:fp=='credito'?(+v('o_pc')||1):null,taxa_pct:pct,taxa_valor:+(T*pct/100).toFixed(2)};
  const ex=EO?Q.find(x=>x.id==EO):null,num=ex?ex.numero:numO();
  if(!ex)o.numero=num;
  if(send)wa(c.telefone,msgO(c,O,T,num));
  const r=ex?await sb.from('astra_orcamentos').update(o).eq('id',EO):await sb.from('astra_orcamentos').insert(o);
  if(r.error)return alert('Não foi possível salvar: '+r.error.message+'\n\nSe a mensagem citar coluna inexistente, rode o arquivo astra-orcamentos-v2.sql no Supabase.');
  alert('Orçamento #'+num+' salvo!');resetO();load();
}
function slots(){const r=[],d=new Date();d.setHours(0,0,0,0);
  for(let i=1;i<150&&r.length<2;i++){const x=new Date(d);x.setDate(d.getDate()+i);
    const ocu=S.filter(s=>s.status=='agendado'&&new Date(s.data_hora).toDateString()==x.toDateString()).map(s=>new Date(s.data_hora).getHours()<12?9:14);
    const f=[9,14].filter(t=>!ocu.includes(t)&&!motivo(x,t==9?'manha':'tarde'));if(f.length)r.push({x,f})}
  return r}
/*CUSTOS*/
const lbl=l=>!l.forma?'Forma não informada':l.forma=='credito'?'Crédito '+(l.parcelas||1)+'x':FP[l.forma];
function linhas(s,q){q=q||{};if(Array.isArray(s.pagamentos)&&s.pagamentos.length)return s.pagamentos.map(p=>({forma:p.forma||'',valor:Number(p.valor||0),parcelas:p.parcelas||null}));const f=s.forma_pagto||q.forma_pagto||'',p=s.forma_pagto?s.parcelas:q.parcelas;return[{forma:f,valor:Number(s.valor||0),parcelas:f=='credito'?(p||1):null}]}
const pgTxt=s=>linhas(s,Q.find(x=>x.id==s.orcamento_id)).map(l=>lbl(l)+(l.forma?' '+brl(l.valor):'')).join(' + ');
const plTot=k=>k=='s'?tot(A):Number((S.find(x=>x.id==PE)||{}).valor||0);
function splitH(k){return `<div style="border:1.5px dashed var(--line);border-radius:14px;padding:8px;margin:6px 0">${PL[k].map((l,n)=>`<div style="display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0"><select onchange="plSet('${k}',${n},'forma',this.value)"><option value="">Não informada</option>${Object.keys(FP).map(f=>`<option value=${f} ${l.forma==f?'selected':''}>${FP[f]}</option>`).join('')}</select><button class="b r" style="margin:0" onclick="plRm('${k}',${n})">✕</button>${l.forma=='credito'?`<select onchange="plSet('${k}',${n},'parcelas',this.value)">${[1,2,3].map(p=>`<option value=${p} ${(l.parcelas||1)==p?'selected':''}>${p}x (taxa ${pf(TX['c'+p])}%)</option>`).join('')}</select><span></span>`:''}<input inputmode=numeric value="${money(l.valor)}" oninput="mk(this);plVal('${k}',${n},this)"><span></span></div>`).join('')}<div id=pl_${k} style="margin:6px 0">${plRes(k)}</div><button class=b onclick="plAdd('${k}')">+ Forma de pagamento</button></div>`}
function plRes(k){const L=PL[k];if(!L.length)return '<small>Nenhuma forma informada (sem taxa de maquininha).</small>';const T=plTot(k),t=L.reduce((a,l)=>a+l.valor,0),f=+(T-t).toFixed(2),tx=L.reduce((a,l)=>a+l.valor*taxaDe(l.forma,l.parcelas)/100,0);
  return `<small>Soma: <b>${brl(t)}</b> de ${brl(T)} · ${f>0?'<b style="color:#b45309">falta '+brl(f)+'</b>':f<0?'<b style="color:#b91c1c">sobra '+brl(-f)+'</b>':'<b style="color:#16a34a">✓ fechado</b>'}${tx?' · taxas: '+brl(tx):''}</small>${f?` <button class="b" style="padding:4px 9px;margin:0" onclick="plFill('${k}')">Ajustar último</button>`:''}`}
function plSet(k,n,f,val){const l=PL[k][n];l[f]=f=='parcelas'?+val:val;if(f=='forma')l.parcelas=val=='credito'?1:null;draw()}
function plVal(k,n,el){PL[k][n].valor=parseInt(el.value.replace(/\D/g,'')||'0',10)/100;$('#pl_'+k).innerHTML=plRes(k)}
function plAdd(k){const r=Math.max(0,plTot(k)-PL[k].reduce((a,l)=>a+l.valor,0));PL[k].push({forma:'pix',valor:+r.toFixed(2),parcelas:null});draw()}
function plRm(k,n){PL[k].splice(n,1);draw()}
function plFill(k){const L=PL[k],l=L[L.length-1];if(!l)return;l.valor=Math.max(0,+(l.valor+plTot(k)-L.reduce((a,x)=>a+x.valor,0)).toFixed(2));draw()}
const plCl=k=>PL[k].filter(l=>l.forma||l.valor>0).map(l=>({forma:l.forma,valor:+Number(l.valor).toFixed(2),parcelas:l.forma=='credito'?(+l.parcelas||1):null}));
function plChk(k){const L=plCl(k),T=plTot(k),t=L.reduce((a,l)=>a+l.valor,0);if(L.length&&Math.abs(t-T)>0.009){alert('A soma das formas de pagamento ('+brl(t)+') precisa ser igual ao valor do serviço ('+brl(T)+').');return false}return true}
function plFields(L,hasCol){if(L.length>1)return{pagamentos:L,forma_pagto:null,parcelas:null};const o={forma_pagto:L[0].forma||null,parcelas:L[0].forma=='credito'?L[0].parcelas:null};if(hasCol)o.pagamentos=null;return o}
function openPE(id){const s=S.find(x=>x.id==id);PE=id;const L=linhas(s,Q.find(x=>x.id==s.orcamento_id));PL.e=L.length==1&&!L[0].forma?[]:L.map(l=>({...l}));draw()}
async function savePE(){const s=S.find(x=>x.id==PE);if(!plChk('e'))return;const L=plCl('e'),hc='pagamentos' in s;
  const o=L.length?plFields(L,hc):{forma_pagto:null,parcelas:null,...(hc?{pagamentos:null}:{})};
  const {error}=await sb.from('astra_servicos').update(o).eq('id',PE);
  if(error)return alert(error.message+'\n\nPara dividir em mais de uma forma, rode o arquivo astra-v5.sql no Supabase.');PE=null;load()}

function vDisp(){
  const hoje=ds(new Date()),prox=[];
  for(let i=0;i<400&&prox.length<6;i++){const x=new Date();x.setDate(x.getDate()+i);const f=feriado(x);if(f)prox.push(dd(x)+' · '+f)}
  const per=p=>p=='dia'?'dia inteiro':p=='manha'?'manhã':'tarde';
  return `<div class=card><h3>Dias de funcionamento</h3>${DIAS.map((n,i)=>`<label style="display:block"><input type=checkbox id=d${i} style="width:auto;margin:6px" ${CF.dias.includes(i)?'checked':''} onchange=saveCF()>${n}</label>`).join('')}
  <label style="display:block"><input type=checkbox id=d_f style="width:auto;margin:6px" ${CF.atende_feriados?'checked':''} onchange=saveCF()>Atender também em feriados</label>
  <small>Feriados nacionais são reconhecidos sozinhos. Feriados municipais você tranca abaixo.</small></div>
  <div class=card><h3>Trancar agenda</h3><small>Data (ou primeiro dia)</small><input id=b_d type=date><small>Até (opcional, para vários dias seguidos)</small><input id=b_f type=date>
  <small>Período</small><select id=b_p><option value=dia>Dia inteiro</option><option value=manha>Só manhã (9h)</option><option value=tarde>Só tarde (14h)</option></select>
  <input id=b_m placeholder="Motivo (ex: consulta médica, feriado municipal)"><button class=b onclick=addB()>Trancar</button></div>
  <div class=card><b>Trancados</b>${B.filter(b=>b.data>=hoje).map(b=>`<div>${dd(b.data+'T12:00:00')} · ${per(b.periodo)}${b.motivo?' · '+esc(b.motivo):''} <button class="b r" onclick="delB('${b.id}')">Destrancar</button></div>`).join('')||'<br><small>Nada trancado.</small>'}</div>
  <div class=card><b>Próximos feriados</b>${prox.map(p=>`<div><small>${p}</small></div>`).join('')}</div>`;
}
async function saveCF(){const dias=[0,1,2,3,4,5,6].filter(i=>$('#d'+i).checked);
  const {error}=await sb.from('astra_config').upsert({id:1,dias,atende_feriados:$('#d_f').checked});error?alert(error.message):load()}
async function addB(){
  if(!v('b_d'))return alert('Escolha a data');
  const a=new Date(v('b_d')+'T12:00:00'),z=v('b_f')?new Date(v('b_f')+'T12:00:00'):a;
  if(z<a)return alert('A data final deve ser depois da inicial');
  const rows=[];for(let x=new Date(a);x<=z&&rows.length<90;x.setDate(x.getDate()+1))rows.push({data:ds(x),periodo:v('b_p'),motivo:v('b_m')||null});
  const n=S.filter(s=>s.status=='agendado'&&rows.some(r=>r.data==ds(new Date(s.data_hora))&&(r.periodo=='dia'||r.periodo==(new Date(s.data_hora).getHours()<12?'manha':'tarde')))).length;
  const {error}=await sb.from('astra_bloqueios').insert(rows);
  if(error)return alert(error.message);
  if(n)alert('Atenção: já existe(m) '+n+' serviço(s) agendado(s) nesse período. Reagende com o cliente.');
  load()}
async function delB(id){await sb.from('astra_bloqueios').delete().eq('id',id);load()}

function cert(id){
  const s=S.find(x=>x.id==id),c=cli(s.cliente_id),d=new jspdf.jsPDF({orientation:'landscape'}),m=148.5;
  d.setDrawColor(20,80,140);d.setLineWidth(1.5);d.rect(8,8,281,194);d.setLineWidth(.4);d.rect(12,12,273,186);
  d.addImage(LOGO,'PNG',m-17,16,34,34);
  d.setTextColor(20,80,140);d.setFont('helvetica','bold');d.setFontSize(30);d.text('CERTIFICADO DE HIGIENIZAÇÃO',m,64,{align:'center'});
  d.setTextColor(30,30,30);d.setFont('helvetica','normal');d.setFontSize(15);d.text('Certificamos que foi realizado o serviço de',m,84,{align:'center'});
  d.setFont('helvetica','bold');d.setFontSize(22);d.text(d.splitTextToSize(s.tipo,240),m,96,{align:'center'});
  d.setFont('helvetica','normal');d.setFontSize(15);d.text('para o cliente',m,110,{align:'center'});
  d.setFont('helvetica','bold');d.setFontSize(26);d.text(full(c),m,123,{align:'center'});
  d.setFont('helvetica','normal');d.setFontSize(14);
  d.text('Data do serviço: '+dd(s.data_hora),m,141,{align:'center'});
  d.text('Nova higienização recomendada a partir de: '+dd(addM(s.data_hora,s.intervalo_meses)),m,151,{align:'center'});
  d.line(100,178,197,178);d.setFontSize(12);d.text('ASTRA Limpadora',m,185,{align:'center'});
  d.save('certificado-'+(full(c)||'cliente').replace(/\s+/g,'-').toLowerCase()+'.pdf');
}
if(sb)init();
</script></body></html>
